name: Validate downstream bb

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0
  PNPM_VERSION: 9.15.0

jobs:
  overlay:
    name: Overlay integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: ./scripts/verify && ./scripts/materialize
      - run: ./scripts/check-p6r-namespace build/bb "$(cat upstream.lock)"

  quality:
    name: Quality (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: build
            args: ""
          - task: typecheck
            args: --concurrency=2
          - task: lint
            args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml
      - run: ./scripts/verify && ./scripts/materialize
      - working-directory: build/bb
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.task }}
        working-directory: build/bb
        run: pnpm exec turbo run ${{ matrix.task }} ${{ matrix.args }} --output-logs=new-only

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            filter: --filter=@bb/server
            args: ""
          - shard: app
            filter: --filter=@bb/app
            args: ""
          - shard: integration
            filter: --filter=@bb/integration-tests
            args: ""
          - shard: packages
            filter: --filter='!@bb/server' --filter='!@bb/app' --filter='!@bb/integration-tests'
            args: --concurrency=2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml
      - run: ./scripts/verify && ./scripts/materialize
      - working-directory: build/bb
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: build/bb
        run: pnpm exec turbo run test ${{ matrix.filter }} ${{ matrix.args }} --output-logs=new-only

  package:
    needs: [overlay, quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml
      - run: ./scripts/verify && ./scripts/materialize
      - working-directory: build/bb
        run: pnpm install --frozen-lockfile
      - name: Package immutable bb-app artifact
        working-directory: build/bb
        run: |
          mkdir -p ../../artifacts
          pnpm bb-app:prepare
          npm pack --pack-destination ../../artifacts ./packages/bb-app
      - uses: actions/upload-artifact@v4
        with:
          name: bb-app-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
